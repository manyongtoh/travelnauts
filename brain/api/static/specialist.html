<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specialist · Company brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brain.css"></head>
<body>
<script src="brain.js"></script>
<script>
let me = store.get("who") || "sanne-de-vries", people = [], reqs = [], current = null;

const app = shell({
  role: "Specialist dashboard",
  nav: [["today", "Today"], ["trips", "All my trips"], ["ask", "Ask the brain"], ["log", "Log"]],
  links: [["teamlead.html", "Team lead view"], ["backoffice.html", "Back office view"]],
  who: `<span class="avatar" id="av">S</span><div><select id="who" aria-label="Working as"></select><small>specialist</small></div>`,
  onNav: v => ({today: viewToday, trips: viewTrips, ask: viewAsk, log: viewLog})[v](),
});

async function init() {
  people = (await api("/api/employees")).filter(e => e.role === "specialist");
  $("#who").innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  if (!people.some(p => p.id === me)) me = people[0].id;
  $("#who").value = me;
  $("#who").onchange = () => { me = $("#who").value; store.set("who", me); current = null; setWho(); app.start(); };
  setWho();
  app.start();
}
function setWho() { const p = people.find(p => p.id === me); $("#av").textContent = initials(p.name); $("#tb-left").textContent = `Team ${TEAMS[p.team_id]}`; }
const kids = n => `${n} ${n === 1 ? "child" : "children"}`;
const myName = () => people.find(p => p.id === me).name;

async function loadReqs() {
  reqs = await api(`/api/requests?specialist=${me}`);
  const waiting = reqs.filter(r => ["new", "proposal_draft", "change_requested"].includes(r.status));
  badge("today", waiting.length);
  return waiting;
}

function itemHtml(r) {
  const [lbl, cls] = REQ_STATUS[r.status] || [r.status, ""];
  return `<li><button class="ditem" data-id="${r.id}" aria-current="${r.id === current}">
    <span class="label ${cls}">${esc(lbl)}</span>
    <span class="fam">Family ${esc(r.family.split(" ").slice(-1)[0])} · ${esc(r.destination_name)}</span>
    <span class="why">${r.days} days, ${r.adults} ${r.adults === 1 ? "adult" : "adults"} and ${kids(r.child_ages.length)} (${r.child_ages.join(", ")}), ${esc(r.depart_month)}</span>
  </button></li>`;
}

async function viewToday() {
  const waiting = await loadReqs();
  const inbox = await api("/api/inbox?status=new");
  const sent = reqs.filter(r => r.status === "proposal_sent").length;
  const first = myName().split(" ")[0];
  $("#view").innerHTML = `
    <div class="hello"><span class="label">${esc(today())}</span><h1>${greeting()}, ${esc(first)}</h1>
      <div class="strip">
        <span class="stat">${icon("clock")}<b class="hot">${waiting.length}</b> waiting for you</span>
        <span class="stat">${icon("send")}<b>${sent}</b> proposals sent</span>
        <button class="stat" id="triage">${icon("mail")}<b>${inbox.length}</b> new mails for triage${inbox.length ? ", process now" : ""}</button>
      </div></div>
    <div class="today">
      <div><p class="label list-label">Waiting for you</p>
        <ul class="dlist">${waiting.map(itemHtml).join("") || `<li class="empty"><b>Nothing waiting</b>Process new mail to fill your list.</li>`}</ul></div>
      <div id="detail">${waiting.length ? "" : `<div class="detail empty"><b>All done</b>New requests appear here after triage.</div>`}</div>
    </div>`;
  $("#triage").onclick = async () => {
    $("#triage").disabled = true; const r = await post("/api/triage"); toast(`${r.length} mails triaged and routed`); viewToday();
  };
  bindList();
  const pick = current && waiting.some(r => r.id === current) ? current : waiting[0] && waiting[0].id;
  if (pick) openReq(pick);
}

async function viewTrips() {
  await loadReqs();
  $("#view").innerHTML = `<div class="vhead"><span class="label">${reqs.length} trips</span><h1>All my trips</h1><p>Everything assigned to you, newest first.</p></div>
    <div class="today"><div><ul class="dlist">${reqs.map(itemHtml).join("")}</ul></div><div id="detail"></div></div>`;
  bindList();
  if (reqs[0]) openReq(current && reqs.some(r => r.id === current) ? current : reqs[0].id);
}
function bindList() { $$(".ditem").forEach(b => b.onclick = () => openReq(b.dataset.id)); }

function tags(q, f, triage) {
  const t = [];
  if (triage && triage.urgent) t.push(["Urgent", "terra"]); else t.push(["Normal priority", "sea"]);
  t.push([q.destination_name, "sea"], [`${q.days} days`, ""], [`${f.adults} ${f.adults === 1 ? "adult" : "adults"}, ${kids(f.child_ages.length)} (${f.child_ages.join(", ")})`, ""]);
  if (q.budget_eur) t.push([`Budget ${eur(q.budget_eur)}`, ""]);
  t.push([q.depart_month, ""]);
  (q.wishes || []).forEach(w => t.push([w, ""]));
  return `<div class="chips">${t.map(([x, c]) => `<span class="pchip ${c}">${esc(x)}</span>`).join("")}</div>`;
}

function draftHtml(d) {
  const kindLabel = {proposal: "Draft travel proposal", change: "Draft reply with the changed proposal", followup: "Draft follow-up", galileo: "Galileo commands", answer: "Draft answer"}[d.kind] || d.kind;
  const price = d.data && d.data.price, route = d.data && d.data.route;
  const warns = [...((price && price.warnings) || []), ...((d.data && d.data.warnings) || [])];
  const approveLabel = d.kind === "galileo" ? "Checked, I will run these in Galileo" : "Approve and send";
  return `
    ${d.kind === "change" ? `<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 0">
      <div class="kpi"><span class="label">Applied</span><b>${d.data.applied.length}</b><p class="sub">${esc(d.data.applied.map(o => o.op.replace("_", " ") + " " + (o.stop || "")).join(", ") || "nothing automatic")}</p></div>
      <div class="kpi ${d.data.manual.length ? "hot" : ""}"><span class="label">For you</span><b>${d.data.manual.length}</b><p class="sub">${esc(d.data.manual.map(o => o.note || o.op.replace("_", " ")).join(", ") || "nothing")}</p></div>
      <div class="kpi"><span class="label">Price</span><b>${eur(d.data.price.sell_eur)}</b><p class="sub">was ${eur(d.data.price_before.sell_eur)} · ${d.data.days_before} → ${d.data.days_after} days</p></div></div>` : ""}
    ${route ? `<p class="label sect">${d.kind === "change" ? "Changed itinerary" : "Draft itinerary"} · ${route.length} stops</p><div class="concept"><table class="itin">${route.map(r =>
      `<tr><td><b>${esc(r.stop)}</b></td><td class="n">${r.nights} ${r.nights === 1 ? "night" : "nights"}${(() => { if (d.kind !== "change") return ""; const b = d.data.route_before.find(x => x.stop === r.stop); const delta = r.nights - (b ? b.nights : 0); return delta ? ` <span class="pchip ${delta > 0 ? "sea" : "terra"}">${delta > 0 ? "+" : ""}${delta}</span>` : ""; })()}</td><td>${esc(r.hotel)}<br><span style="color:var(--muted)">${esc((r.activities || []).join(", "))}</span></td></tr>`).join("")}</table></div>` : ""}
    ${price ? `<p class="label sect">Calculation · ${price.persons} persons</p><details class="concept calc"><summary><span>Total for the family${price.warnings.length ? ` · <span style="color:var(--terra-ink)">${price.warnings.length} to check</span>` : ""}</span><span><b>${eur(price.sell_eur)}</b> <span style="color:var(--muted)">· margin ${eur(price.margin_eur)} · show lines</span></span></summary><table class="itin">${price.lines.map(l =>
      `<tr><td>${esc(l.name)}${l.valid ? "" : ` <span class="pchip terra">price expired</span>`}</td><td class="n">× ${l.qty}</td><td class="num">${eur(l.cost)}</td><td class="num">${eur(l.sell)}</td></tr>`).join("")}
      <tr class="tot"><td>Total</td><td></td><td class="num">${eur(price.cost_eur)}</td><td class="num">${eur(price.sell_eur)}</td></tr>
      <tr><td style="color:var(--muted)">Margin</td><td></td><td></td><td class="num" style="color:var(--muted)">${eur(price.margin_eur)}</td></tr></table></details>` : ""}
    <p class="label sect">${esc(kindLabel)}</p>
    <div class="concept">
      <div class="c-head"><div><div class="c-title">${esc(d.title)}</div><div class="c-to">${d.status === "draft" ? "Edit freely. Your changes are measured to improve the brain." : `${d.status === "approved" ? "Approved" : "Rejected"} by ${esc(d.decided_by)}${d.status === "approved" ? ` · ${Math.round((d.edit_share || 0) * 100)}% edited` : ""}`}</div></div>
        <span class="pchip ${d.status === "approved" ? "sea" : d.status === "rejected" ? "terra" : "gold"}">${esc(d.status)}</span></div>
      ${d.status === "draft" ? `<textarea class="c-text ${d.kind === "galileo" ? "mono" : ""}" id="body-${d.id}" rows="14">${esc(d.body)}</textarea>`
                             : `<pre class="c-text ${d.kind === "galileo" ? "mono" : ""}">${esc(d.final_body || d.body)}</pre>`}
      ${warns.length ? `<div class="check"><b>Check:</b> ${warns.map(esc).join(" · ")}</div>` : ""}
    </div>
    ${(d.sources || []).some(s => s.title) ? `<p class="label sect">Sources</p>${sourcesList(d.sources)}` : ""}
    ${d.status === "draft" ? `<div class="actions"><button class="btn btn-primary btn-lg" onclick="approve(${d.id})">${icon("check")} ${approveLabel}</button>
      <button class="btn-link" onclick="reject(${d.id})">Reject</button></div>` : ""}`;
}

async function openReq(id) {
  current = id;
  $$(".ditem").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  const r = await api(`/api/requests/${id}`);
  const q = r.request, f = r.family;
  const latest = r.drafts.filter(d => d.kind === "proposal" || d.kind === "change").slice(-1)[0];
  const pending = (r.changes || []).filter(m => m.status === "triaged");
  const others = r.drafts.filter(d => d !== latest).reverse();
  const [lbl] = REQ_STATUS[q.status] || [q.status];
  $("#detail").innerHTML = `<div class="detail">
    <span class="label">${esc(lbl)} · Team ${esc(TEAMS[q.team_id] || "")}</span>
    <h2 class="d-title">Family ${esc(f.surname)} · ${esc(q.destination_name)}</h2>
    <p class="d-sum">${f.adults} ${f.adults === 1 ? "adult" : "adults"}, ${kids(f.child_ages.length)} (${f.child_ages.join(" and ")}) · ${q.days} days · ${q.budget_eur ? "budget " + eur(q.budget_eur) : "no budget given"} · ${esc(q.depart_month)}</p>
    ${r.mail ? `<p class="label sect">Incoming email</p><div class="concept"><dl class="mailhead"><dt>From</dt><dd>${esc(f.contact_name)}</dd><dt>Subject</dt><dd>${esc(r.mail.subject)}</dd>
      <dt>Received</dt><dd>${esc(new Date(r.mail.received_at).toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"}))}</dd></dl><pre class="c-text">${esc(r.mail.body)}</pre></div>
      <p class="label sect">Triage tags</p>${tags(q, f, r.mail.triage)}` : ""}
    ${pending.map(m => `<p class="label sect hot" style="color:var(--terra-ink)">Change request</p><div class="concept"><dl class="mailhead"><dt>From</dt><dd>${esc(f.contact_name)}</dd><dt>Subject</dt><dd>${esc(m.subject)}</dd></dl>
      <pre class="c-text">${esc(m.body)}</pre></div><div class="actions"><button class="btn btn-primary btn-lg" onclick="applyChange('${m.id}')">${icon("bolt")} Let the agent apply the change</button></div>`).join("")}
    ${latest ? draftHtml(latest) : `<div class="actions"><button class="btn btn-primary btn-lg" onclick="act('proposal')">${icon("bolt")} Write travel proposal</button></div>`}
    <div class="actions">
      ${latest ? `<button class="btn btn-outline" onclick="act('proposal')">New version</button>` : ""}
      <button class="btn btn-outline" onclick="act('galileo')">Galileo commands</button>
      ${latest ? `<button class="btn btn-outline" onclick="act('partners')">Ask partners for availability</button>` : ""}
    </div>
    <div class="guard">${icon("shield")} Agents prepare, you decide. Nothing goes to the family or a partner without your click.</div>
    <div class="more">
      ${r.partners.length ? `<details open><summary>Partner requests <span class="hint">${r.partners.length}, handled by the back office</span></summary><div class="inner">
        <table class="itin">${r.partners.map(p => `<tr><td><b>${esc(p.partner)}</b><br><span style="color:var(--muted)">${esc(p.what)}</span></td>
        <td><span class="status ${p.status === "answered" ? "go" : p.status === "to_send" ? "me" : "wait"}">${esc(p.status.replace("_", " "))}</span></td>
        <td>${p.available === false ? "Not available" : esc(p.note || "")}</td><td class="num">${p.price_eur ? eur(p.price_eur) : ""}</td></tr>`).join("")}</table></div></details>` : ""}
      ${others.map(d => `<details><summary>${esc({galileo: "Galileo commands", followup: "Follow-up", proposal: "Earlier version", change: "Earlier change", answer: "Answer"}[d.kind] || d.kind)}
        <span class="hint">${esc(d.title)} · ${esc(d.status)}</span></summary><div class="inner">${draftHtml(d)}</div></details>`).join("")}
    </div></div>`;
  $$("textarea.c-text").forEach(t => { const fit = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + 4 + "px"; }; t.oninput = fit; fit(); });
}

async function act(kind) {
  try { await post(`/api/requests/${current}/${kind}`); toast(kind === "partners" ? "Partner requests drafted for the back office" : "Draft ready"); openReq(current); loadReqs(); }
  catch (e) { toast(e.message); }
}
async function applyChange(mid) {
  try { await post(`/api/mails/${mid}/change`); toast("Changed proposal ready to check"); openReq(current); }
  catch (e) { toast(e.message); }
}
async function approve(id) {
  await post(`/api/drafts/${id}/approve`, {by: myName(), final_body: $(`#body-${id}`).value});
  toast("Approved. In the sandbox nothing is actually sent."); openReq(current); loadReqs();
}
async function reject(id) { await post(`/api/drafts/${id}/reject`, {by: myName()}); toast("Rejected"); openReq(current); }

function viewAsk() {
  $("#view").innerHTML = `<div class="vhead"><span class="label">Knowledge desk</span><h1>Ask the brain</h1>
    <p>Answers come only from approved knowledge, with sources. If the brain does not know, it says so and the question goes on your team's gap list.</p></div>
    <div class="detail" style="max-width:820px">
      <div style="display:flex;gap:10px"><input id="q" style="flex:1;height:44px;border:1px solid var(--sand);border-radius:var(--r-sm);padding:0 14px;background:var(--white)" placeholder="Bijvoorbeeld: wat is de beste reistijd voor Japan?">
      <button class="btn btn-primary" id="ask">${icon("search")} Ask</button></div>
      <div class="chips" style="margin-top:12px">${["Wat is de beste reistijd voor Japan?", "Welke hotels kennen we in Hoi An?", "Wat zijn onze betaaltermijnen?", "Kun je in Sri Lanka goed glutenvrij eten?"]
        .map(x => `<button class="pchip" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div id="answer"></div></div>`;
  const run = async () => {
    const p = people.find(p => p.id === me);
    const a = await post("/api/ask", {question: $("#q").value, team_id: p.team_id});
    $("#answer").innerHTML = `<p class="label sect">${a.confident ? "Answer" : "Not known yet"}</p>
      <div class="${a.confident ? "info" : "note"}">${esc(a.answer)}</div>
      ${a.sources.length ? `<p class="label sect">Sources</p>${sourcesList(a.sources)}` : ""}
      ${a.gap_id ? `<div class="guard">${icon("gap")} Added to the knowledge gap list of Team ${esc(TEAMS[p.team_id])}.</div>` : ""}`;
  };
  $("#ask").onclick = run;
  $("#q").onkeydown = e => { if (e.key === "Enter") run(); };
  $$("[data-q]").forEach(b => b.onclick = () => { $("#q").value = b.dataset.q; run(); });
}

async function viewLog() {
  const runs = await api("/api/audit?limit=60");
  const cols = "grid-template-columns:150px 140px 170px minmax(0,1fr) 70px";
  $("#view").innerHTML = `<div class="vhead"><span class="label">Audit log</span><h1>What the agents did</h1><p>Every run, with the model, the sources used and how long it took.</p></div>
    <ul class="list"><li class="row row-head label" style="${cols}"><span>Time (UTC)</span><span>Agent</span><span>Subject</span><span>Result</span><span>Sources</span></li>
    ${runs.map(a => `<li class="row" style="${cols}">
      <span class="mono">${esc(a.created_at.replace("T", " ").slice(0, 16))}</span><b>${esc(a.agent.replace("_", " "))}</b><span class="mono">${esc(a.subject || "")}</span>
      <span>${esc(a.output_summary)}</span><span class="mono">${a.sources.length}</span></li>`).join("")}</ul>`;
}

init();
</script>
</body></html>
