<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specialist · Company brain</title><link rel="stylesheet" href="brain.css"></head>
<body>
<main>
  <div class="row">
    <label class="small muted">Working as</label><select id="who"></select>
    <button class="ghost" id="triage">Process new mail</button>
    <span class="small muted" id="inboxinfo"></span>
  </div>
  <div class="cols" style="grid-template-columns:320px 1fr 360px">
    <div class="card list" id="reqs"><h2>My requests</h2><div class="muted small">Loading…</div></div>
    <div class="card" id="detail"><h2>Request</h2><p class="muted">Pick a request on the left.</p></div>
    <div class="card">
      <h2>Ask the brain</h2>
      <div class="row"><input id="q" style="flex:1" placeholder="Bijv. beste reistijd Japan"><button class="teal" id="ask">Ask</button></div>
      <div id="answer" style="margin-top:10px"></div>
    </div>
  </div>
</main>
<script src="brain.js"></script>
<script>
header("Specialist");
let current = null;

async function loadPeople() {
  const people = (await api("/api/employees")).filter(e => e.role === "specialist");
  $("#who").innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)} (${p.team_id})</option>`).join("");
  $("#who").value = localStorageGet("who") || "sanne-de-vries";
  $("#who").onchange = () => { localStorageSet("who", $("#who").value); loadReqs(); };
}
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function loadInbox() {
  const mails = await api("/api/inbox?status=new");
  $("#inboxinfo").textContent = mails.length ? `${mails.length} new mails waiting for triage` : "Inbox is triaged";
}

async function loadReqs() {
  const reqs = await api(`/api/requests?specialist=${$("#who").value}`);
  $("#reqs").innerHTML = `<h2>My requests (${reqs.length})</h2>` + (reqs.length ? reqs.map(r => `
    <div class="item ${r.id === current ? "on" : ""}" data-id="${r.id}">
      <div class="row"><b>${esc(r.family)}</b>${chip(r.status)}</div>
      <div class="small muted">${esc(r.destination_name)} · ${r.days} dagen · ${esc(r.depart_month)} · kinderen ${r.child_ages.join(", ")}</div>
    </div>`).join("") : `<p class="muted small">No requests yet. Click "Process new mail".</p>`);
  document.querySelectorAll("#reqs .item").forEach(el => el.onclick = () => openReq(el.dataset.id));
}

function sourcesHtml(sources) {
  const k = (sources || []).filter(s => s.type === "knowledge" || s.title);
  if (!k.length) return "";
  return `<div class="small" style="margin-top:8px"><b>Sources</b><br>` + k.map(s =>
    `<span class="chip ${s.outdated ? "red" : "teal"}">${esc(s.id)}</span> ${esc(s.title)} <span class="muted">· owner ${esc(s.owner)} · review by ${esc(s.review_by)}${s.outdated ? " · outdated" : ""}</span>`).join("<br>") + `</div>`;
}

function draftHtml(d) {
  const price = d.data && d.data.price;
  const warns = [...((price && price.warnings) || []), ...((d.data && d.data.warnings) || [])];
  return `<div class="card" style="margin-top:12px;background:#fff">
    <div class="row"><b>${esc(d.title)}</b><span class="chip">${esc(d.kind)}</span><span class="chip ${d.status === "approved" ? "teal" : d.status === "rejected" ? "red" : "gold"}">${esc(d.status)}</span></div>
    ${warns.map(w => `<div class="warn">${esc(w)}</div>`).join("")}
    ${price ? `<table style="margin:8px 0"><tr><th>Price</th><th class="num">Cost</th><th class="num">Sell</th></tr>
      ${price.lines.map(l => `<tr><td>${esc(l.name)} <span class="muted">× ${l.qty}</span></td><td class="num">${eur(l.cost)}</td><td class="num">${eur(l.sell)}</td></tr>`).join("")}
      <tr><td><b>Total (${price.persons} persons)</b></td><td class="num">${eur(price.cost_eur)}</td><td class="num"><b>${eur(price.sell_eur)}</b></td></tr>
      <tr><td class="muted">Margin</td><td></td><td class="num muted">${eur(price.margin_eur)}</td></tr></table>` : ""}
    ${d.status === "draft"
      ? `<textarea id="body-${d.id}">${esc(d.body)}</textarea>
         <div class="row" style="margin-top:8px"><button class="teal" onclick="approve(${d.id})">${d.kind === "galileo" ? "Checked, I will run these in Galileo" : "Approve and send"}</button>
         <button class="ghost" onclick="reject(${d.id})">Reject</button><span class="small muted">Your edits are measured to improve the brain.</span></div>`
      : `<pre>${esc(d.final_body || d.body)}</pre><div class="small muted">Edited: ${Math.round((d.edit_share || 0) * 100)}% · by ${esc(d.decided_by)}</div>`}
    ${sourcesHtml(d.sources)}
  </div>`;
}

async function openReq(id) {
  current = id;
  const r = await api(`/api/requests/${id}`);
  const q = r.request, f = r.family;
  $("#detail").innerHTML = `<h2>Request ${esc(q.id)}</h2>
    <h3>${esc(f.contact_name)} · ${esc(q.destination_name)}</h3>
    <div class="small muted">${f.adults} ${f.adults === 1 ? "volwassene" : "volwassenen"}, kinderen ${f.child_ages.join(", ")} · ${q.days} dagen · ${esc(q.depart_month)} · budget ${q.budget_eur ? eur(q.budget_eur) : "onbekend"} · ${esc((q.wishes || []).join(", "))}</div>
    ${r.mail ? `<details style="margin-top:8px"><summary class="small">Original mail</summary><pre>${esc(r.mail.body)}</pre></details>` : ""}
    <div class="row" style="margin-top:12px">
      <button onclick="act('proposal')">Write proposal</button>
      <button class="ghost" onclick="act('galileo')">Galileo commands</button>
      <button class="ghost" onclick="act('partners')">Ask partners</button>
    </div>
    ${r.partners.length ? `<div style="margin-top:12px"><b class="small">Partner requests <span class="muted">(handled by the back office)</span></b><table>${r.partners.map(p =>
      `<tr><td>${esc(p.partner)}</td><td>${chip(p.status)}</td><td class="small">${esc(p.note || p.what)}</td><td class="num">${p.price_eur ? eur(p.price_eur) : ""}</td></tr>`).join("")}</table></div>` : ""}
    ${r.drafts.slice().reverse().map(draftHtml).join("")}`;
  loadReqs();
}

async function act(kind) {
  try { await post(`/api/requests/${current}/${kind}`); toast("Draft ready"); openReq(current); }
  catch (e) { toast(e.message); }
}
async function approve(id) {
  await post(`/api/drafts/${id}/approve`, {by: $("#who").selectedOptions[0].text, final_body: $(`#body-${id}`).value});
  toast("Approved"); openReq(current);
}
async function reject(id) { await post(`/api/drafts/${id}/reject`, {by: $("#who").value}); toast("Rejected"); openReq(current); }

$("#triage").onclick = async () => {
  $("#triage").disabled = true;
  const res = await post("/api/triage");
  $("#triage").disabled = false;
  toast(`${res.length} mails triaged`); loadInbox(); loadReqs();
};
$("#ask").onclick = async () => {
  const a = await post("/api/ask", {question: $("#q").value});
  $("#answer").innerHTML = `<div class="${a.confident ? "ok" : "warn"}">${esc(a.answer)}</div>` + sourcesHtml(a.sources) +
    (a.gap_id ? `<div class="small muted">Added to the knowledge gap list (#${a.gap_id}).</div>` : "");
};
$("#q").onkeydown = e => { if (e.key === "Enter") $("#ask").click(); };
loadPeople().then(() => { loadInbox(); loadReqs(); });
</script>
</body></html>
