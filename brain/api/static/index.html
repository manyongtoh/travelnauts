<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company brain sandbox</title><link rel="stylesheet" href="brain.css"></head>
<body>
<main style="max-width:900px;margin:0 auto">
  <div class="card">
    <h2>Sandbox</h2>
    <h3>The Travelnauts company brain, on made-up data</h3>
    <p>Everything here is synthetic: families, partners, prices and staff are invented. Agents only write drafts; a person approves every mail before it goes out.</p>
    <div class="row">
      <a href="specialist.html"><button>Specialist</button></a>
      <a href="teamlead.html"><button class="ghost">Team lead</button></a>
      <a href="backoffice.html"><button class="ghost">Back office</button></a>
      <a href="/docs"><button class="ghost">API</button></a>
    </div>
  </div>
  <div class="card small muted" id="status">Loading…</div>
</main>
<script src="brain.js"></script>
<script>api("/api/status").then(s => $("#status").innerHTML = Object.entries(s).map(([k, v]) => `<b>${esc(k)}</b>: ${esc(v)}`).join(" · "));</script>
</body></html>
