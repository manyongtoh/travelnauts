<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Back office · Company brain</title><link rel="stylesheet" href="brain.css"></head>
<body>
<main>
  <div class="row">
    <button id="chase">Draft reminders for slow partners</button>
    <button class="ghost" id="sim">Simulate partner replies</button>
    <span class="small muted" id="info"></span>
  </div>
  <div class="kanban" id="board"></div>
  <div class="cols" style="grid-template-columns:2fr 1fr">
    <div class="card"><h2>Mails to check before sending</h2><div id="drafts"></div></div>
    <div class="card"><h2>Slowest partners</h2><div id="slow"></div></div>
  </div>
</main>
<script src="brain.js"></script>
<script>
header("Back office");
const COLS = [["to_send", "To send"], ["waiting", "Waiting"], ["chased", "Reminder sent"], ["answered", "Answered"], ["declined", "Declined"]];
async function load() {
  const b = await api("/api/backoffice");
  $("#info").textContent = `${b.chase_due} requests waiting longer than 3 days · ${b.drafts_to_check} mails to check`;
  $("#board").innerHTML = COLS.map(([k, n]) => {
    const cards = b.cards.filter(c => c.status === k);
    return `<div class="col"><h2>${n} (${cards.length})</h2>${cards.slice(0, 14).map(c => `<div class="k">
      <b>${esc(c.partner)}</b><div class="muted">${esc(c.request_id)} · ${esc(c.what)}</div>
      ${c.waiting_days != null ? `<div class="${c.chase_due ? "" : "muted"}" style="${c.chase_due ? "color:var(--red)" : ""}">${c.waiting_days} days waiting</div>` : ""}
      ${c.offer ? `<div>${c.offer.available ? "Available" : "Not available"} · ${eur(c.offer.price_eur)}<br><span class="muted">${esc(c.offer.note)}</span></div>` : ""}
    </div>`).join("")}${cards.length > 14 ? `<div class="small muted">+ ${cards.length - 14} more</div>` : ""}</div>`;
  }).join("");
  $("#slow").innerHTML = `<table><tr><th>Partner</th><th class="num">Days to reply</th><th class="num">Reliable</th></tr>${b.slowest_partners.map(p =>
    `<tr><td>${esc(p.partner)}</td><td class="num">${p.avg_reply_days}</td><td class="num">${Math.round(p.reliability * 100)}%</td></tr>`).join("")}</table>`;
  const drafts = await api("/api/drafts?kind=partner_request,partner_chase");
  $("#drafts").innerHTML = drafts.length ? drafts.slice(0, 10).map(d => `<div class="card" style="background:#fff;margin-bottom:10px">
      <div class="row"><b>${esc(d.title)}</b><span class="chip">${esc(d.kind.replace("_", " "))}</span><span class="small muted">to ${esc(d.data.to)}</span></div>
      <textarea id="b-${d.id}" style="min-height:160px">${esc(d.body)}</textarea>
      <div class="row"><button class="teal" onclick="ok(${d.id})">Approve and send</button></div></div>`).join("")
    : `<p class="muted small">Nothing to check. Ask partners from a request on the specialist screen, or draft reminders.</p>`;
}
async function ok(id) { await post(`/api/drafts/${id}/approve`, {by: "Ruben Stam", final_body: $(`#b-${id}`).value}); toast("Sent (in the sandbox: marked as sent)"); load(); }
$("#chase").onclick = async () => { const r = await post("/api/jobs/chases"); toast(`${r.length} reminders drafted`); load(); };
$("#sim").onclick = async () => { const r = await post("/api/jobs/simulate-replies"); toast(`${r.answered} partners answered`); load(); };
load();
</script>
</body></html>
