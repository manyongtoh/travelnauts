<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team lead · Company brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brain.css"></head>
<body>
<script src="i18n.js"></script>
<script src="brain.js"></script>
<script>
let team = store.get("tl:team") || "all", kfilter = "proposed";
const app = shell({
  role: "Team lead",
  nav: [["overview", "Overview"], ["complaints", "Complaints"], ["value", "Value"], ["insight", "Insight"], ["knowledge", "Knowledge"], ["gaps", "Knowledge gaps"], ["duplicates", "Duplicates"], ["log", "Log"]],
  needs: "team.metrics",
  onNav: v => ({overview: viewOverview, complaints: viewComplaints, value: viewValue, insight: viewInsight, knowledge: viewKnowledge, gaps: viewGaps, duplicates: viewDuplicates, log: viewLog})[v](),
});
$("#tb-left").textContent = "Pilot · synthetic stage";

const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
function pick(data) {
  const ts = Object.entries(data.teams).filter(([id]) => team === "all" || id === team).map(([, t]) => t);
  const appr = sum(ts, t => t.proposals_approved);
  const edit = appr ? sum(ts, t => (t.avg_edit_share || 0) * t.proposals_approved) / appr : null;
  const mins = ts.filter(t => t.avg_minutes_to_first_draft != null);
  const status = {};
  ts.forEach(t => Object.entries(t.status).forEach(([k, v]) => status[k] = (status[k] || 0) + v));
  return {ts, open: sum(ts, t => t.open_requests), drafted: sum(ts, t => t.proposals_drafted), appr, edit, status,
    mins: mins.length ? sum(mins, t => t.avg_minutes_to_first_draft) / mins.length : null,
    fu: ts.flatMap(t => t.followups_waiting), fudue: sum(ts, t => t.followups_due), gaps: ts.flatMap(t => t.gaps)};
}
function teamChips() {
  return `<div class="fchips"><span class="label" style="margin-right:6px">Team</span>${[["all", "All"], ...Object.entries(TEAMS)].map(([id, n]) =>
    `<button class="fchip" data-team="${id}" aria-pressed="${team === id}">${n}</button>`).join("")}</div>`;
}
function bindTeam(rerender) { $$("[data-team]").forEach(b => b.onclick = () => { team = b.dataset.team; store.set("tl:team", team); rerender(); }); }
const inTeam = k => team === "all" || !k.team_id || k.team_id === team;

async function viewOverview() {
  const data = await api("/api/teamlead");
  const p = pick(data);
  badge("knowledge", data.proposed_knowledge.length);
  badge("gaps", Object.values(data.teams).reduce((a, t) => a + t.gaps.length, 0));
  const maxS = Math.max(1, ...Object.values(p.status));
  const S = [["new", "New", "terra"], ["proposal_draft", "Draft ready", "gold"], ["proposal_sent", "Proposal sent", ""], ["booked", "Booked", "sea"], ["lost", "Lost", ""]];
  const review = data.review_due.filter(inTeam), proposed = data.proposed_knowledge.filter(inTeam);
  const flagged = await api("/api/inbox?status=flagged");
  const inboxMax = Math.max(1, ...Object.values(data.inbox));
  $("#view").innerHTML = `
    <div class="hello"><span class="label">${esc(today())}</span><h1>${greeting()}</h1>
      <div class="strip">
        <span class="stat">${icon("mail")}<b>${p.open}</b> open requests</span>
        <span class="stat">${icon("bolt")}<b>${p.drafted}</b> proposals drafted</span>
        <span class="stat">${icon("check")}<b>${p.appr}</b> approved</span>
        <span class="stat">${icon("clock")}<b class="${p.fudue ? "hot" : ""}">${p.fudue + p.fu.length}</b> follow-ups</span>
        <span class="stat">${icon("gap")}<b class="${p.gaps.length ? "hot" : ""}">${p.gaps.length}</b> knowledge gaps</span>
      </div>
      <div class="guard">${icon("shield")} Figures are per team, never per person. They are here to share work fairly and to see where the brain needs help, not to judge anyone.</div></div>
    <div class="filters">${teamChips()}</div>
    <div class="grid2">
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:0">
          <div class="kpi"><span class="label">Share edited</span><b>${p.edit == null ? "n/a" : Math.round(p.edit * 100) + "%"}</b><p class="sub">of approved proposals, lower is better</p></div>
          <div class="kpi"><span class="label">Mail to first draft</span><b>${p.mins == null ? "n/a" : p.mins.toFixed(1) + " min"}</b><p class="sub">agent time, not the specialist's</p></div>
          <div class="kpi"><span class="label">Agent runs, 24 h</span><b>${data.agent_runs_24h}</b><p class="sub">all logged with sources</p></div>
        </div>
        <div class="card"><h2>Requests by status</h2><p class="sub">${team === "all" ? "All teams" : "Team " + TEAMS[team]}, synthetic data</p>
          <div class="bars">${S.map(([k, n, c]) => `<div class="bar"><span>${n}</span><span class="track"><span class="fill ${c}" style="width:${100 * (p.status[k] || 0) / maxS}%"></span></span><span class="v">${p.status[k] || 0}</span></div>`).join("")}</div></div>
        <div class="card"><h2>Inbox</h2><p class="sub">Mail in the (fake) TravelSpirit inbox, all teams</p>
          <div class="bars">${Object.entries(data.inbox).map(([k, v]) => `<div class="bar"><span>${({new: "Waiting for triage", triaged: "Triaged", done: "Handled", flagged: "Held as suspicious", needs_person: "Needs a person"})[k] || k}</span><span class="track"><span class="fill ${["new", "flagged", "needs_person"].includes(k) ? "terra" : "sea"}" style="width:${100 * v / inboxMax}%"></span></span><span class="v">${v}</span></div>`).join("")}</div></div>
      </div>
      <div class="card"><h2>Needs attention</h2><p class="sub">What the agents flagged for a person</p>
        <ul class="att">
          ${flagged.map(m => `<li><span class="label hot">Suspicious mail, no draft made</span><div class="t">${esc(m.subject)}</div><small>${esc((m.triage.injection || {}).reasons?.join(", ") || "")} · a person should look at it</small></li>`).join("")}
          ${p.fudue ? `<li><span class="label hot">Follow-ups due</span><div class="row-act"><span class="t">${p.fudue} proposals without a reply for 5 days</span><button class="btn-link" id="runfu">Draft follow-ups</button></div></li>` : ""}
          ${p.fu.slice(0, 4).map(f => `<li><span class="label">Follow-up waiting for the specialist</span><div class="t">${esc(f.title)}</div><small>${esc(f.request_id)} · ${f.days_since} days since the proposal</small></li>`).join("")}
          ${p.gaps.slice(0, 4).map(g => `<li><span class="label hot">Knowledge gap · ${esc(g.reason.replace("_", " "))}</span><div class="t">${esc(g.question)}</div><small>asked ${g.count}×</small></li>`).join("")}
          ${proposed.slice(0, 3).map(k => `<li><span class="label">Knowledge waiting for approval</span><div class="row-act"><span class="t">${esc(k.title)}</span><button class="btn-link" data-approve="${k.id}">Approve</button></div></li>`).join("")}
          ${review.slice(0, 3).map(k => `<li><span class="label hot">Past review date</span><div class="t">${esc(k.title)}</div><small>review was due ${esc(k.review_by)}, answers using it are flagged</small></li>`).join("")}
          ${!(p.fudue || p.fu.length || p.gaps.length || proposed.length || review.length) ? `<li class="empty"><b>Nothing needs you</b></li>` : ""}
        </ul></div>
    </div>`;
  bindTeam(viewOverview); bindApprove(viewOverview);
  const fu = $("#runfu"); if (fu) fu.onclick = async () => { const r = await post("/api/jobs/followups"); toast(`${r.length} follow-ups drafted for the specialists`); viewOverview(); };
}
function bindApprove(after) {
  $$("[data-approve]").forEach(b => b.onclick = async () => { await post(`/api/knowledge/${b.dataset.approve}/approve`, {by: "Team lead"}); toast("Approved. Agents can use it now."); after(); });
}

async function viewComplaints() {
  const rows = await api("/api/complaints");
  const open = rows.filter(d => d.status === "draft");
  badge("complaints", open.filter(d => d.data.severity === "high").length);
  $("#view").innerHTML = `<div class="vhead"><span class="label">${open.length} open · ${rows.length - open.length} handled</span><h1>Complaints</h1>
    <p>The complaint agent sorts each complaint and drafts a careful reply. It never promises money: refunds, compensation and discounts are your decision. High priority replies need your approval.</p></div>
    ${open.map(d => `<div class="detail" style="margin-bottom:18px">
      <span class="label ${d.data.severity === "high" ? "hot" : ""}">${esc(d.data.severity)} priority${d.data.while_travelling ? " · travelling now" : ""} · ${esc(d.request_id || "no trip found")}</span>
      <h2 class="d-title">${esc(d.mail ? d.mail.subject : d.title)}</h2>
      ${d.mail ? `<div class="concept"><pre class="c-text">${esc(d.mail.body)}</pre></div>` : ""}
      <p class="label sect">Internal actions</p><ul class="att">${d.data.actions.map(a => `<li class="t">${esc(a)}</li>`).join("")}</ul>
      <p class="label sect">Draft reply</p><div class="concept"><textarea class="c-text" id="cb-${d.id}" rows="9" aria-label="${esc(T("Draft reply"))}">${esc(d.body)}</textarea>
      ${(d.data.warnings || []).length ? `<div class="check"><b>Check:</b> ${d.data.warnings.map(esc).join(" · ")}</div>` : ""}</div>
      <div class="actions"><button class="btn btn-primary" data-ok="${d.id}">Approve and send</button><button class="btn-link" data-confirm="Click again to discard" data-no="${d.id}">Discard</button></div></div>`).join("")
      || `<div class="detail empty"><b>No open complaints</b></div>`}`;
  $$("[data-ok]").forEach(b => b.onclick = async () => {
    try { await post(`/api/drafts/${b.dataset.ok}/approve`, {final_body: $(`#cb-${b.dataset.ok}`).value}); toast("Approved (logged)"); } catch (e) { toast(e.message); }
    viewComplaints(); });
  $$("[data-no]").forEach(b => b.onclick = async () => { await post(`/api/drafts/${b.dataset.no}/reject`, {reason: "team lead"}); viewComplaints(); });
}

async function viewInsight() {
  const [ci, ti, people, unlinked] = await Promise.all([api("/api/reports/customer_insight"), api("/api/reports/team_insight"),
                                                       api("/api/employees"), api("/api/mails/unlinked").catch(() => [])]);
  const teams = team === "all" ? Object.keys(TEAMS) : [team];
  const none = `<div class="detail empty"><b>No report yet</b>The insight agents run nightly and hourly. <button class="btn btn-outline btn-sm" id="runins">Run them now</button></div>`;
  if (!ci.teams || !ti.teams) { $("#view").innerHTML = `<div class="vhead"><h1>Insight</h1></div>${none}`; $("#runins").onclick = runIns; return; }
  $("#view").innerHTML = `<div class="vhead"><span class="label">Customer insight ${esc(ci.at || "")} · team insight ${esc(ti.at || "")}</span><h1>Insight</h1>
    <p>Totals per team: what families ask for, and where requests get stuck. Nothing per person.</p></div>
    <div class="filters">${teamChips()}<button class="btn btn-outline btn-sm" id="runins" style="margin-left:auto">Refresh now</button></div>
    ${unlinked.length ? `<div class="card" style="margin-bottom:18px;border-color:#E5B39C;background:var(--terra-tint)"><h2>Mail from an unknown address</h2>
      <p class="sub" style="color:var(--terra-ink)">Which family wrote this? Never linked by the brain itself: the reply would go to this address.</p>
      <ul class="att">${unlinked.map(m => `<li><div class="row-act" style="flex-wrap:wrap;gap:8px"><span class="t"><b>${esc(m.subject)}</b>
        <span class="mono" style="color:var(--muted)">${esc(m.sender)} · ${esc(m.category || "")}${m.shared_address ? " · shared address" : ""}</span></span>
        <select data-link="${esc(m.id)}" aria-label="${esc(T("Link to family…"))}" style="height:30px;border:1px solid var(--sand);border-radius:6px;background:var(--white)"><option value="">Link to family…</option>
        ${m.candidates.map(c => `<option value="${esc(c.family_id)}">${esc(c.name)} (${esc(c.why.join(", "))})</option>`).join("")}
        <option value="?">Other family (id)…</option></select>
        <label style="font-size:12px"><input type="checkbox" data-remember="${esc(m.id)}" ${m.shared_address ? "" : "checked"}> remember this address</label></div></li>`).join("")}</ul></div>` : ""}
    ${teams.map(t => { const c = ci.teams[t] || {}, x = ti.teams[t] || {stuck: []};
      return `<div class="grid2" style="margin-bottom:18px">
      <div class="card"><h2>Team ${TEAMS[t]}: what families ask</h2><p class="sub">${c.requests || 0} requests · average ${c.avg_trip_days || "n/a"} days · budget ${c.avg_budget_eur ? eur(c.avg_budget_eur) : "n/a"} · booked ${c.booked_share_pct ?? "n/a"}% of offers</p>
        <div class="bars">${(c.top_destinations || []).map(([d, n]) => `<div class="bar"><span>${esc(d)}</span><span class="track"><span class="fill sea" style="width:${100 * n / Math.max(1, c.requests)}%"></span></span><span class="v">${n}</span></div>`).join("")}</div>
        <p class="label sect">Top wishes</p><div class="chips">${(c.top_wishes || []).map(([w, n]) => `<span class="pchip">${esc(w)} · ${n}</span>`).join("")}</div></div>
      ${(x.ownerless || []).length ? `<div class="card" style="grid-column:1/-1;border-color:#E5B39C;background:var(--terra-tint)"><h2>Requests without an owner</h2>
        <p class="sub" style="color:var(--terra-ink)">The specialist on these trips has left. Reassign them today.</p>
        <ul class="att">${x.ownerless.map(rid => `<li><div class="row-act"><span class="t"><b class="mono">${esc(rid)}</b></span>
          <select data-reassign="${rid}" aria-label="${esc(T("Reassign to…"))} ${esc(rid)}" style="height:30px;border:1px solid var(--sand);border-radius:6px;background:var(--white)"><option value="">Reassign to…</option>${people.filter(p => p.role === "specialist" && p.team_id === t).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div></li>`).join("")}</ul></div>` : ""}
      <div class="card"><h2>Stuck requests</h2><p class="sub">${x.open ?? 0} open · ${x.waiting_for_specialist ?? 0} waiting for a specialist · first draft after ${x.avg_hours_to_first_draft ?? "n/a"} h</p>
        <ul class="att">${x.stuck.map(r => `<li><div class="row-act"><span class="t"><b class="mono">${esc(r.request_id)}</b> ${esc(r.status.replace("_", " "))}, ${r.days} days</span>
          <select data-reassign="${r.request_id}" aria-label="${esc(T("Reassign to…"))} ${esc(r.request_id)}" style="height:30px;border:1px solid var(--sand);border-radius:6px;background:var(--white)"><option value="">Reassign to…</option>${people.filter(p => p.role === "specialist" && p.team_id === t).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div></li>`).join("") || `<li class="empty"><b>Nothing stuck</b></li>`}</ul></div></div>`; }).join("")}`;
  bindTeam(viewInsight);
  $("#runins").onclick = runIns;
  $$("[data-link]").forEach(s => s.onchange = async () => {
    let fid = s.value;
    if (!fid) return;
    if (fid === "?") { fid = (window.prompt("Family id from TravelSpirit") || "").trim(); if (!fid) return; }
    const remember = $(`[data-remember="${s.dataset.link}"]`).checked;
    try { const r = await post(`/api/mails/${s.dataset.link}/link`, {family_id: fid, remember_address: remember});
          toast(r.address_remembered ? "Linked; address remembered (logged)" : "Linked (logged)"); viewInsight(); } catch (e) { toast(e.message); }
  });
  $$("[data-reassign]").forEach(s => s.onchange = async () => {
    if (!s.value) return;
    try { await post(`/api/requests/${s.dataset.reassign}/reassign`, {specialist_id: s.value}); toast("Reassigned (logged)"); } catch (e) { toast(e.message); }
  });
}
async function runIns() { await post("/api/jobs/run/customer_insight"); await post("/api/jobs/run/team_insight"); toast("Insight refreshed"); viewInsight(); }

async function viewKnowledge() {
  const [items, data] = await Promise.all([api("/api/knowledge"), api("/api/teamlead")]);
  const due = new Set(data.review_due.map(k => k.id));
  const teamOf = Object.fromEntries([...data.review_due, ...data.proposed_knowledge].map(k => [k.id, k.team_id]));
  const F = {proposed: ["Waiting for approval", k => k.status === "proposed"], due: ["Past review date", k => due.has(k.id)],
             approved: ["Approved", k => k.status === "approved"], all: ["All", () => true]};
  const rows = items.filter(F[kfilter][1]).filter(k => inTeam({team_id: teamOf[k.id]}));
  const cols = "grid-template-columns:minmax(0,2fr) minmax(0,1fr) 120px 130px 120px";
  $("#view").innerHTML = `<div class="vhead"><span class="label">${items.length} items</span><h1>Knowledge</h1>
    <p>Agents only use approved knowledge. Each item has an owner and a review date.</p></div>
    <div class="filters"><div class="fchips"><span class="label" style="margin-right:6px">Show</span>${Object.entries(F).map(([id, [n]]) =>
      `<button class="fchip" data-k="${id}" aria-pressed="${kfilter === id}">${n}</button>`).join("")}</div>${teamChips()}</div>
    <ul class="list"><li class="row row-head label" style="${cols}"><span>Item</span><span>Owner</span><span>Review by</span><span>Status</span><span></span></li>
    ${rows.map(k => `<li class="row" style="${cols}"><div><b>${esc(k.title)}</b><small>${esc(k.body)}</small></div><span>${esc(k.owner)}</span>
      <span class="mono" style="${due.has(k.id) ? "color:var(--terra-ink)" : ""}">${esc(k.review_by)}</span>
      <span class="status ${k.status === "approved" ? (due.has(k.id) ? "me" : "go") : "wait"}">${k.status === "approved" ? (due.has(k.id) ? "check again" : "approved") : "waiting"}</span>
      <span>${k.status === "proposed" || due.has(k.id) ? `<button class="btn btn-outline btn-sm" data-approve="${k.id}">${k.status === "proposed" ? "Approve" : "Still correct"}</button>` : ""}</span></li>`).join("")
      || `<li class="empty"><b>Nothing here</b>No items match this filter.</li>`}</ul>`;
  $$("[data-k]").forEach(b => b.onclick = () => { kfilter = b.dataset.k; viewKnowledge(); });
  bindTeam(viewKnowledge); bindApprove(viewKnowledge);
}

async function viewGaps() {
  const gaps = await api(`/api/gaps${team === "all" ? "" : "?team=" + team}`);
  const cols = "grid-template-columns:minmax(0,2fr) 150px 120px 80px";
  $("#view").innerHTML = `<div class="vhead"><span class="label">${gaps.length} open</span><h1>Knowledge gaps</h1>
    <p>Questions the brain could not answer well, answers built on outdated knowledge, and drafts that specialists rewrote heavily. This tells the team what to write down next.</p></div>
    <div class="filters">${teamChips()}</div>
    <ul class="list"><li class="row row-head label" style="${cols}"><span>Question</span><span>Why</span><span>Team</span><span>Asked</span></li>
    ${gaps.map(g => `<li class="row" style="${cols}"><b>${esc(g.question)}</b><span class="pchip ${g.reason === "no_answer" ? "terra" : "gold"}" style="justify-self:start">${esc(g.reason.replace("_", " "))}</span>
      <span>${esc(TEAMS[g.team_id] || "")}</span><span class="mono">${g.count}×</span></li>`).join("")
      || `<li class="empty"><b>No open gaps</b>Ask the brain something it does not know on the specialist screen to see one appear.</li>`}</ul>`;
  bindTeam(viewGaps);
}

let vdays = +(store.get("tl:vdays") || 30);
const KIND_LABEL = {proposal: "Proposals", change: "Changes", followup: "Follow-ups", partner_request: "Partner requests", partner_chase: "Partner chases",
  extras: "Extras offers", roadbook: "Roadbooks", answer: "Answers", complaint_reply: "Complaint replies", alternatives: "Alternatives",
  next_trip: "Next trip ideas", trip_alert: "Trip alerts"};
const n = v => v == null ? "–" : v;
const hrs = h => h == null ? "–" : h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : `${Math.round(h * 10) / 10} h`;
async function viewValue() {
  const q = `days=${vdays}&team=${encodeURIComponent(team)}`;
  const r = await api(`/api/value?${q}`), b = r.baseline;
  const kinds = Object.entries(r.quality.per_kind).filter(([, k]) => k.drafted);
  const cols = "grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(80px,1fr))";
  $("#view").innerHTML = `<div class="vhead"><span class="label">Value</span><h1>What the brain is worth</h1>
      <p>Counted from what happened in the last ${vdays} days. Hours saved is an estimate: drafts sent, times the minutes a person used to spend, minus what was rewritten.</p></div>
    <div class="filters">${teamChips()}<div class="fchips"><span class="label" style="margin-right:6px">Period</span>${[7, 30, 90, 365].map(d =>
      `<button class="fchip" data-days="${d}" aria-pressed="${vdays === d}">${d} days</button>`).join("")}</div></div>
    ${b.measured ? "" : `<div class="guard">${icon("shield")} The baseline is an assumption until the team measures it with the pilot group. Change it below; every figure updates.</div>`}
    <div class="kpis">
      <div class="kpi"><span class="label">Hours saved (est.)</span><b>${r.hours_saved_estimate}</b></div>
      <div class="kpi"><span class="label">First proposal ready</span><b>${hrs(r.speed.median_hours_to_first_proposal_draft)}</b><small>was ${b.hours_to_first_proposal} h</small></div>
      <div class="kpi"><span class="label">Sent unchanged</span><b>${n(r.quality.sent_unchanged_pct)}%</b><small>rewritten ${n(r.quality.avg_rewrite_pct)}%</small></div>
      <div class="kpi"><span class="label">Done unprompted</span><b>${r.unprompted.drafts}</b><small>drafts nobody asked for</small></div>
      <div class="kpi"><span class="label">Partner answered</span><b>${n(r.back_office.answered_pct)}%</b><small>median ${n(r.back_office.median_reply_days)} days</small></div>
      <div class="kpi"><span class="label">Booked</span><b>${n(r.sales.booked_pct)}%</b><small>of ${r.sales.proposals_sent} proposals sent</small></div>
    </div>
    <ul class="list"><li class="row row-head label" style="${cols}"><span>Work</span><span>Drafted</span><span>Sent</span><span>Unchanged</span><span>Sent automatically</span><span>Minutes each</span></li>
    ${kinds.map(([k, x]) => `<li class="row" style="${cols}"><b>${esc(KIND_LABEL[k] || k)}</b><span class="mono">${x.drafted}</span><span class="mono">${x.sent}</span>
      <span class="mono">${n(x.sent_unchanged_pct)}%</span><span class="mono">${x.auto_sent}</span>
      <span><input class="mono" type="number" min="0" max="1000" step="1" data-min="${k}" value="${b.minutes[k] ?? 0}" style="width:70px" aria-label="Minutes per ${esc(KIND_LABEL[k] || k)} today"></span></li>`).join("") || `<li class="row">Nothing drafted in this period.</li>`}</ul>
    <div class="actions" style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label>Hours to first proposal today <input class="mono" type="number" min="0" max="1000" id="v-hours" value="${b.hours_to_first_proposal}" style="width:70px"></label>
      <label><input type="checkbox" id="v-measured" ${b.measured ? "checked" : ""}> Baseline measured</label>
      <button class="btn btn-primary" id="v-save">Save baseline</button>
      <a class="btn btn-outline" href="/api/value.csv?${q}" download="brain-value.csv">Download CSV</a></div>
    <p class="sub" style="margin-top:14px;color:var(--muted)">Also: ${r.back_office.invoices_checked} invoices checked, ${r.unprompted.followups_withdrawn} follow-ups withdrawn because the family wrote first,
      ${r.knowledge.gaps_answered} knowledge gaps answered, ${r.knowledge.learned_waiting} learned notes waiting for review, ${r.safety.mail_flagged} suspicious mails held.</p>`;
  bindTeam(viewValue);
  $$("[data-days]").forEach(x => x.onclick = () => { vdays = +x.dataset.days; store.set("tl:vdays", vdays); viewValue(); });
  $("#v-save").onclick = async () => {
    const minutes = {}; $$("[data-min]").forEach(i => minutes[i.dataset.min] = +i.value);
    await post("/api/value/baseline", {minutes, hours_to_first_proposal: +$("#v-hours").value, measured: $("#v-measured").checked});
    toast("Baseline saved"); viewValue();
  };
}
async function viewDuplicates() { renderDuplicates(await api("/api/duplicates")); }
function renderDuplicates(rows) {
  badge("duplicates", rows.filter(r => r.level === "likely").length);
  $("#view").innerHTML = `<div class="vhead"><span class="label">${rows.length} ${rows.length === 1 ? "pair" : "pairs"}</span><h1>Duplicate families</h1>
      <p>The same family twice: entered twice in TravelSpirit, or a first mail from the other parent's address. Nothing merges by itself: a wrong merge sends one family's mail to another. Merging here moves trips, mail and addresses; the TravelSpirit administrator merges there from the plan.</p></div>
    <div class="actions" style="margin-bottom:16px"><a class="btn btn-outline" href="/api/duplicates.csv" download="travelspirit-merge-plan.csv">Download merge plan for TravelSpirit</a></div>
    <ul class="list">${rows.map((r, i) => `<li class="row" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:start;gap:14px">
      <div><span class="label">Keep · ${r.keep_in_travelspirit ? "in TravelSpirit" : "new in the brain"} · ${r.keep_trips} ${r.keep_trips === 1 ? "trip" : "trips"}</span><b style="display:block">${esc(r.keep_name)}</b><span class="mono">${esc(r.keep)}</span></div>
      <div><span class="label">Merge into it · ${r.drop_in_travelspirit ? "in TravelSpirit" : "new in the brain"} · ${r.drop_trips} ${r.drop_trips === 1 ? "trip" : "trips"}</span><b style="display:block">${esc(r.drop_name)}</b><span class="mono">${esc(r.drop)}</span>
        <p class="sub" style="margin-top:6px"><span class="pill ${r.level === "likely" ? "pill-concept" : "pill-local"}">${esc(r.level)}</span> ${r.evidence.map(esc).join(" · ")}</p></div>
      <div style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-primary btn-sm" data-confirm="Click again to merge" data-merge="${i}">Merge</button><button class="btn btn-outline btn-sm" data-swap="${i}">Swap</button><button class="btn-link" data-apart="${i}">Keep apart</button></div></li>`).join("")
      || `<li class="row empty"><b>No likely duplicates</b></li>`}</ul>`;
  $$("[data-merge]").forEach(b => b.onclick = async () => { const r = rows[b.dataset.merge];
    const res = await post("/api/duplicates/merge", {keep: r.keep, drop: r.drop});
    toast(`Merged (logged): ${res.moved.trips} trips, ${res.moved.mails} mails moved`); viewDuplicates(); });
  $$("[data-swap]").forEach(b => b.onclick = () => { const r = rows[b.dataset.swap];
    [r.keep, r.drop, r.keep_name, r.drop_name, r.keep_trips, r.drop_trips, r.keep_in_travelspirit, r.drop_in_travelspirit] =
      [r.drop, r.keep, r.drop_name, r.keep_name, r.drop_trips, r.keep_trips, r.drop_in_travelspirit, r.keep_in_travelspirit];
    renderDuplicates(rows); });
  $$("[data-apart]").forEach(b => b.onclick = async () => { const r = rows[b.dataset.apart];
    await post("/api/duplicates/apart", {keep: r.keep, drop: r.drop}); toast("Kept apart (logged)"); viewDuplicates(); });
}
async function viewLog() {
  const runs = await api("/api/audit?limit=60");
  const cols = "grid-template-columns:150px 140px 170px minmax(0,1fr) 70px 70px";
  $("#view").innerHTML = `<div class="vhead"><span class="label">Audit log</span><h1>What the agents did</h1><p>Every run, with the sources used and how long it took.</p></div>
    <ul class="list"><li class="row row-head label" style="${cols}"><span>Time (UTC)</span><span>Agent</span><span>Subject</span><span>Result</span><span>Sources</span><span>ms</span></li>
    ${runs.map(a => `<li class="row" style="${cols}"><span class="mono">${esc(a.created_at.replace("T", " ").slice(0, 16))}</span><b>${esc(a.agent.replace("_", " "))}</b>
      <span class="mono">${esc(a.subject || "")}</span><span>${esc(a.output_summary)}</span><span class="mono">${a.sources.length}</span><span class="mono">${a.ms}</span></li>`).join("")}</ul>`;
}
app.start();
</script>
