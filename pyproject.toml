[project]
name = "travelnauts-brain-sandbox"
version = "0.1.0"
description = "Sandbox for the Travelnauts company brain. Synthetic data only."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai-slim[openai]>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "mcp>=2",
  "pyjwt[crypto]>=2.8",
  "alembic>=1.13",
  "reportlab>=4",
  "pypdf>=6.21.4",  # reads partner PDFs (untrusted): keep current, checked by pip-audit in CI
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
"brain.api" = ["static/*"]
"brain.prompts" = ["*.md", "agents/*.md"]
"brain.knowledge" = ["vault/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests share helpers (from tests.test_api import ...)
filterwarnings = ["ignore::DeprecationWarning"]
