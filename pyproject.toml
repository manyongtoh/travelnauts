[project]
name = "travelnauts-brain-sandbox"
version = "0.1.0"
description = "Sandbox for the Travelnauts company brain. Synthetic data only."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai-slim[openai]>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "scikit-learn>=1.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
"brain.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
