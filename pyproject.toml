[project]
name = "brain-core"
version = "0.1.0"
description = "brain-core: the company brain platform of Myt B.V. Synthetic data only."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai-slim[openai]>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "mcp>=2",
  "pyjwt[crypto]>=2.8",
  "alembic>=1.13",
  "reportlab>=4",
  "pypdf>=6.21.4",  # reads partner PDFs (untrusted): keep current, checked by pip-audit in CI
  "openpyxl>=3.1",  # supplier rate sheets in, dossier calculations out
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
brain = "brain.cli:main"

[project.entry-points."brain.tenants"]
wolkenwaai = "brain.sample_tenant:pack"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
"brain.api" = ["static/*"]
"brain.prompts" = ["agents/*.md"]
"brain.sample_tenant" = ["tenant.toml", "house.md"]
"brain.knowledge" = ["vault/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests share helpers (from tests.test_api import ...)
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
  "B008",    # FastAPI's Depends()/Header() in default arguments is the framework's own pattern
  "ISC004",  # long prompts, regexes and letters are written as adjacent strings on purpose
  "SIM905",  # word lists written as one block of text and split, easier to read and edit than a list literal
  "DTZ001", "DTZ011",  # the app keeps naive UTC times everywhere (brain.clock); mixing aware times would break comparisons
]
