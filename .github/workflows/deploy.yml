name: deploy
# Manual: pick an environment. GitHub environments "pilot" and "live" need an approval (set reviewers in
# repository settings), so a change only reaches live after a person signs off and the evals pass.
# NOT YET USED: needs Travelnauts' Azure subscription and a federated credential for GitHub (OIDC).
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [test, pilot, live]
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_DATABASE_URL: sqlite:///data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: brain bench --gate
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Infrastructure
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
        run: |
          az deployment group create -g rg-brain-${{ inputs.env }} \
            --template-file infra/main.bicep --parameters infra/params/${{ inputs.env }}.bicepparam \
            --query properties.outputs -o json > out.json
      - name: Image
        run: |
          REG=$(jq -r .registry.value out.json)
          az acr build -r ${REG%%.*} -t brain:${{ github.sha }} .
          az containerapp update -g rg-brain-${{ inputs.env }} -n ca-brain-${{ inputs.env }}-api --image $REG/brain:${{ github.sha }}
          az containerapp job update -g rg-brain-${{ inputs.env }} -n cj-brain-${{ inputs.env }}-worker --image $REG/brain:${{ github.sha }}
