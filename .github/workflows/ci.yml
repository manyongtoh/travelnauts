name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_DATABASE_URL: sqlite:///data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q
      - run: brain bench --gate
      - run: cat data/bench/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: data/bench/
  postgres:
    # The same tests on Postgres with pgvector, the migrations, and a load test with parallel workers.
    runs-on: ubuntu-24.04  # ships postgresql-client-16, matching the server for pg_dump
    services:
      pg:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: brain, POSTGRES_PASSWORD: brain, POSTGRES_DB: brain }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_TEST_DATABASE_URL: postgresql+psycopg://brain:brain@localhost:5432/brain
      BRAIN_DATABASE_URL: postgresql+psycopg://brain:brain@localhost:5432/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: Migrations apply and match the models
        run: |
          psql postgresql://brain:brain@localhost:5432/brain -c "create database brain_mig"
          BRAIN_DATABASE_URL=postgresql+psycopg://brain:brain@localhost:5432/brain_mig alembic upgrade head
          BRAIN_DATABASE_URL=postgresql+psycopg://brain:brain@localhost:5432/brain_mig alembic check
      - run: pytest -q
      - name: Load test, 4 parallel workers
        run: brain loadtest --mails 400 --workers 4 | tee load.json && python -c "import json; d=json.load(open('load.json')); assert d['mails_triaged_more_than_once']==0 and d['mails_left_untriaged']==0 and d['audit_chain']['ok'], d"
      - name: Two weeks of simulated operation, then a backup and restore drill
        run: |
          sudo apt-get install -y -q postgresql-client-16 && export PATH=/usr/lib/postgresql/16/bin:$PATH
          psql postgresql://brain:brain@localhost:5432/brain -c "create database brain_ops"
          BRAIN_DATABASE_URL=postgresql+psycopg://brain:brain@localhost:5432/brain_ops brain simulate --days 14
          python -c "import json; d=json.load(open('data/ops/simulation.json')); bad=[x for x in d['days'] if x['failed_jobs_total'] or x['mails_untriaged'] or x['triaged_twice'] or not x['audit_chain_ok']]; assert not bad, bad"
          python -c "import json; d=json.load(open('data/ops/simulation.json')); noisy=[x['day'] for x in d['days'] if not x['events'] and not x['checks'] and x['alerts']]; assert not noisy, f'alerts on quiet days: {noisy}'"
          scripts/backup_drill.sh postgresql://brain:brain@localhost:5432/brain_ops
          cat data/ops/simulation.md >> "$GITHUB_STEP_SUMMARY"
  security:
    # Known vulnerabilities in dependencies, and risky patterns in our own code. Either one fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Dependencies have no known vulnerabilities
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > req.txt
          pip-audit -r req.txt
      - name: No medium or high findings in our code
        run: bandit -q -r brain -ll
      - name: Azure templates compile (infrastructure and alerts)
        env:
          PG_PASSWORD: compile-check-only  # placeholder; real values come from secrets at deploy
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for p in infra/params/*.bicepparam; do az bicep build-params --file "$p" --stdout > /dev/null; done
