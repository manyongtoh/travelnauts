name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_DATABASE_URL: sqlite:///data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q
      - run: brain bench --gate
      - run: cat data/bench/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: data/bench/
  postgres:
    # The same tests on Postgres with pgvector, the migrations, and a load test with parallel workers.
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: brain, POSTGRES_PASSWORD: brain, POSTGRES_DB: brain }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_TEST_DATABASE_URL: postgresql+psycopg://brain:brain@localhost:5432/brain
      BRAIN_DATABASE_URL: postgresql+psycopg://brain:brain@localhost:5432/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: Migrations apply and match the models
        run: |
          psql postgresql://brain:brain@localhost:5432/brain -c "create database brain_mig"
          BRAIN_DATABASE_URL=postgresql+psycopg://brain:brain@localhost:5432/brain_mig alembic upgrade head
          BRAIN_DATABASE_URL=postgresql+psycopg://brain:brain@localhost:5432/brain_mig alembic check
      - run: pytest -q
      - name: Load test, 4 parallel workers
        run: brain loadtest --mails 400 --workers 4 | tee load.json && python -c "import json; d=json.load(open('load.json')); assert d['mails_triaged_more_than_once']==0 and d['mails_left_untriaged']==0 and d['audit_chain']['ok'], d"
