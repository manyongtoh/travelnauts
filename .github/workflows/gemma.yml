name: gemma
# Test #1: Gemma 4 on the bench. Two ways, chosen when you start it (Actions > gemma > Run workflow):
#   runner-cpu  Ollama on the GitHub runner (4 CPUs, no GPU): free but very slow, so a small sample.
#   hosted      a hosted Gemma 4 behind an OpenAI compatible API (default: Google AI Studio). Fast, so a bigger
#               sample. Needs the repository secret GEMMA_API_KEY. Synthetic data only: never send real data to a
#               free tier.
# The report, with Gemma's own proposal texts, is in the run summary.
on:
  workflow_dispatch:
    inputs:
      where:
        description: "Where Gemma runs"
        type: choice
        options: [runner-cpu, hosted]
        default: runner-cpu
      model:
        description: "Model: gemma4:e4b or gemma4:e2b on the runner; the provider's name when hosted (for example gemma-4-31b-it)"
        default: gemma4:e4b
      base_url:
        description: "Hosted only: the OpenAI compatible address"
        default: https://generativelanguage.googleapis.com/v1beta/openai/
      mails:
        description: "How many mails through triage (30 on the runner; 60 or more hosted)"
        default: "30"
      proposals:
        description: "How many proposals to write (4 on the runner; 10 hosted)"
        default: "4"
jobs:
  modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      BRAIN_MODEL_SMALL: ${{ inputs.where == 'hosted' && 'openai' || 'ollama' }}:${{ inputs.model }}
      BRAIN_MODEL_LARGE: ${{ inputs.where == 'hosted' && 'openai' || 'ollama' }}:${{ inputs.model }}
      BRAIN_MODEL_BASE_URL: ${{ inputs.where == 'hosted' && inputs.base_url || 'http://localhost:11434/v1' }}
      BRAIN_MODEL_API_KEY: ${{ inputs.where == 'hosted' && secrets.GEMMA_API_KEY || 'ollama' }}
      BRAIN_MODEL_TIMEOUT: ${{ inputs.where == 'hosted' && '120' || '900' }}   # CPU only: a proposal can take minutes
      BRAIN_DAILY_BUDGET_EUR: "1000"      # a test run: do not let the budget stop it
      BRAIN_DATABASE_URL: sqlite:///data/modelcheck.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Check the key
        if: inputs.where == 'hosted'
        run: test -n "$BRAIN_MODEL_API_KEY" || { echo "Add the repository secret GEMMA_API_KEY first"; exit 1; }
      - name: Install Ollama
        if: inputs.where == 'runner-cpu'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_KEEP_ALIVE=24h nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama --version
      - name: Download ${{ inputs.model }}
        if: inputs.where == 'runner-cpu'
        run: ollama pull ${{ inputs.model }} && ollama run ${{ inputs.model }} "Zeg hallo in één zin." && ollama ps
      - name: Model check
        run: brain modelcheck --mails ${{ inputs.mails }} --proposals ${{ inputs.proposals }} --complaints 3 --replies 4
      - if: always()
        run: |
          cat data/modelcheck/report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          tail -50 ollama.log 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelcheck-${{ github.run_id }}
          path: data/modelcheck/
